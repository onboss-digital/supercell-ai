name: Deploy SupercellAI

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/supercell-ai || git clone https://github.com/${{ github.repository }}.git ~/supercell-ai
            cd ~/supercell-ai
            git pull origin main
            
            # Atualiza o Frontend usando Docker (passando a URL da API para o build)
            docker run --rm -v ~/supercell-ai/super-front:/app -w /app -e VITE_API_URL=https://supercellia.com node:20-slim sh -c "npm install && npm run build"
            
            # Atualiza os Containers (Backend e DB)
            docker-compose up -d --build
            docker image prune -f
