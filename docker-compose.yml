version: '3.8'

services:
  # Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: supercell_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecret}
      POSTGRES_DB: supercell_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - supercell_network

  # Backend Node.js
  backend:
    build: 
      context: ./super-back
      dockerfile: Dockerfile
    container_name: supercell_back
    restart: always
    depends_on:
      - db
    env_file:
      - ./super-back/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-supersecret}@db:5432/supercell_ai?schema=public
    networks:
      - supercell_network
    ports:
      - "3005:3005"

  # Frontend servido via Nginx
  frontend:
    build:
      context: ./super-front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://supercellia.com}
    container_name: supercell_front
    restart: always
    ports:
      - "8081:80"
    networks:
      - supercell_network

networks:
  supercell_network:
    driver: bridge

volumes:
  pgdata:
